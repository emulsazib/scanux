[project]
name = "scanu-agents"
version = "0.1.0"
description = "Scanu multi-agent pipeline: Perception -> Correlation -> Remediation (LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "openai>=1.60",
    "httpx>=0.27",
    "aiokafka>=0.12",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanu_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
