[package]
name = "scanu-desktop"
version = "0.1.0"
edition = "2021"
description = "Scanu tray client: Tier-2 prompts and instant freeze notifications"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde_json = "1"
