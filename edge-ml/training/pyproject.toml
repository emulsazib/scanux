[project]
name = "scanu-edge-training"
version = "0.1.0"
description = "Trains the on-device static classifier and exports ONNX + linear fallback"
requires-python = ">=3.12"
dependencies = ["pefile>=2024.8.26", "numpy>=2"]

[dependency-groups]
dev = ["pytest>=8"]
train = ["lightgbm>=4.5", "onnxmltools>=1.13", "onnx>=1.17", "scikit-learn>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
