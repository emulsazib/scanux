[project]
name = "scanu-api"
version = "0.1.0"
description = "Scanu cloud API: tenants, incidents, HITL state machine, command signing, audit log"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "aiokafka>=0.12",
    "cryptography>=43",
    "protobuf>=7.35.1",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanu_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
